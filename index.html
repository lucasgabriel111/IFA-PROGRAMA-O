<!DOCTYPE html>
<html lang="pt-BR">

  <title>Galeria de Mídia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Seção de Imagens -->
    <div class="galeria-imagens">
      <h2>Imagens</h2>

      <img src="https://via.placeholder.com/300x150" alt="Imagem 2">

    <div class="secao-videos">

        <p>Espaço reservado para vídeo</p>
      </div>

  </div>

</html>
