<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Acessível</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="#conteudo-principal" class="skip-link">Ir para o conteúdo principal</a>

    <header role="banner">
        <h1>Galeria Acessível</h1>
    </header>

    <main id="conteudo-principal" role="main">
        
        <section aria-labelledby="titulo-imagens">
            <h2 id="titulo-imagens">Galeria de Imagens</h2>
            <div class="grid-galeria">
                
                <figure class="item-card">
                    <img src="imagem1.jpg" alt="Descrição detalhada do conteúdo da imagem 1" class="midia-acessivel">
                    <figcaption>Legenda explicativa da Imagem 1</figcaption>
                </figure>

                <figure class="item-card">
                    <img src="imagem2.jpg" alt="Descrição detalhada do conteúdo da imagem 2" class="midia-acessivel">
                    <figcaption>Legenda explicativa da Imagem 2</figcaption>
                </figure>

                <figure class="item-card">
                    <img src="imagem3.jpg" alt="Descrição detalhada do conteúdo da imagem 3" class="midia-acessivel">
                    <figcaption>Legenda explicativa da Imagem 3</figcaption>
                </figure>

                <figure class="item-card">
                    <img src="imagem4.jpg" alt="Descrição detalhada do conteúdo da imagem 4" class="midia-acessivel">
                    <figcaption>Legenda explicativa da Imagem 4</figcaption>
                </figure>

                <figure class="item-card">
                    <img src="imagem5.jpg" alt="Descrição detalhada do conteúdo da imagem 5" class="midia-acessivel">
                    <figcaption>Legenda explicativa da Imagem 5</figcaption>
                </figure>

                <figure class="item-card">
                    <img src="imagem6.jpg" alt="Descrição detalhada do conteúdo da imagem 6" class="midia-acessivel">
                    <figcaption>Legenda explicativa da Imagem 6</figcaption>
                </figure>

                <figure class="item-card">
                    <img src="imagem7.jpg" alt="Descrição detalhada do conteúdo da imagem 7" class="midia-acessivel">
                    <figcaption>Legenda explicativa da Imagem 7</figcaption>
                </figure>

                <figure class="item-card">
                    <img src="imagem8.jpg" alt="Descrição detalhada do conteúdo da imagem 8" class="midia-acessivel">
                    <figcaption>Legenda explicativa da Imagem 8</figcaption>
                </figure>

            </div>
        </section>

        <section aria-labelledby="titulo-videos">
            <h2 id="titulo-videos">Vídeos</h2>
            <div class="grid-galeria">

                <figure class="item-card">
                    <video controls class="midia-acessivel">
                        <source src="video1.mp4" type="video/mp4">
                        <track kind="captions" src="legendas1.vtt" srclang="pt-br" label="Português" default>
                        Seu navegador não suporta a reprodução deste vídeo.
                    </video>
                    <figcaption>Vídeo 1: Descrição do tema abordado no vídeo.</figcaption>
                </figure>

                <figure class="item-card">
                    <video controls class="midia-acessivel">
                        <source src="video2.mp4" type="video/mp4">
                        <track kind="captions" src="legendas2.vtt" srclang="pt-br" label="Português">
                        Seu navegador não suporta a reprodução deste vídeo.
                    </video>
                    <figcaption>Vídeo 2: Descrição do tema abordado no vídeo.</figcaption>
                </figure>

            </div>
        </section>

    </main>

    <footer role="contentinfo">
        <p>&copy; 2026 - Conteúdo focado em acessibilidade visual e auditiva.</p>
    </footer>

</body>
</html>
